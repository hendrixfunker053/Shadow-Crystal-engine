
name: Build

on:
  push:
    branches: [ main, experimental ]
    paths-ignore: [ '**.md', 'docs/**', 'art/**', '.vscode/**' ]
  pull_request:
    branches: [ main, experimental ]
    paths-ignore: [ '**.md', 'docs/**', 'art/**', '.vscode/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Restore Haxelib Cache
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-android-4.3.7-${{ hashFiles('setup/unix.sh') }}

      - name: Restore hxcpp Cache
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: hxcpp-android-${{ github.sha }}
          restore-keys: hxcpp-android-

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Project.xml', 'project/android/**/*.gradle') }}
          restore-keys: gradle-

      - name: Install Haxelib
        run: |
          mkdir -p ~/.hxcpp_cache
          echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp_cache" >> $GITHUB_ENV
          echo "::notice title=hxcpp cache (restored)::$(du -sh ~/.hxcpp_cache | cut -f1)"
          haxelib setup ~/haxelib
          if [ "${{ steps.haxelib-cache.outputs.cache-hit }}" != "true" ]; then
            haxelib install hxcpp > /dev/null --quiet
            chmod +x ./setup/unix.sh
            sh ./setup/unix.sh
          fi

      - name: Use Bundled Lua
        run: |
          LUA_PATH=$(haxelib libpath linc_luajit)
          for LIB in "$LUA_PATH"/lib/lua/lib/Android/*.a; do printf '!<arch>\n' > "$LIB"; done

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Prepare Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "SIGNING_FLAG=-D ANDROID_SIGNING" >> $GITHUB_ENV
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret, building with the debug key"
          fi

      - name: Compile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! haxelib run lime build android -D officialBuild $SIGNING_FLAG 2>&1 | tee compile.log; then
            grep -n -i -E "error|failed|exception" compile.log | tail -n 40 > errors.log || true
            echo "::error title=lime build android (errors)::$(sed 's/%/%25/g' errors.log | awk '{printf "%s%%0A", $0}')"
            echo "::error title=lime build android (tail)::$(tail -n 60 compile.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "::notice title=hxcpp cache (after build)::$(du -sh ~/.hxcpp_cache | cut -f1)"

      - name: Verify APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKS=$(find export/release/android/bin/app/build/outputs/apk -name "*.apk")
          if [ -z "$APKS" ]; then echo "No APK found"; exit 1; fi
          for APK in $APKS; do
            echo "Verifying $APK"
            "$BUILD_TOOLS/zipalign" -c -p 4 "$APK"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          done

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  buildiOS:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Restore Haxelib Cache
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-ios-4.3.7-${{ hashFiles('setup/unix.sh') }}

      - name: Restore hxcpp Cache
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: hxcpp-ios-${{ github.sha }}
          restore-keys: hxcpp-ios-

      - name: Install Haxelib
        run: |
          mkdir -p ~/.hxcpp_cache
          echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp_cache" >> $GITHUB_ENV
          echo "::notice title=hxcpp cache (restored)::$(du -sh ~/.hxcpp_cache | cut -f1)"
          arch -x86_64 haxelib setup ~/haxelib
          if [ "${{ steps.haxelib-cache.outputs.cache-hit }}" != "true" ]; then
            arch -x86_64 haxelib install hxcpp > /dev/null --quiet
            chmod +x ./setup/unix.sh
            arch -x86_64 /bin/sh ./setup/unix.sh
          fi

      - name: Use Bundled Lua
        run: |
          LUA_PATH=$(arch -x86_64 haxelib libpath linc_luajit)
          mkdir -p "$LUA_PATH/lib/lua/lib/iPhone"
          printf '!<arch>\n' > "$LUA_PATH/lib/lua/lib/iPhone/libluajit.iphoneos-64.a"
          printf '!<arch>\n' > "$LUA_PATH/lib/lua/lib/iPhone/libluajit.iphonesim-64.a"

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Compile
        run: |
          arch -x86_64 haxelib run lime build ios -D officialBuild 2>&1 | tee compile.log || true
          if ! ls export/release/ios/*.xcodeproj > /dev/null 2>&1; then
            echo "::error title=lime build ios::$(tail -n 60 compile.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            arch -x86_64 haxe -version 2>&1 | sed 's/^/::error title=haxe::/'
            arch -x86_64 haxelib list 2>&1 | head -n 40 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=haxelib list::/'
            exit 1
          fi

      - name: Build Xcode Project
        run: |
          cd export/release/ios
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJECT" ]; then echo "The Xcode project was not generated, check the Compile step for the real error"; exit 1; fi
          xcodebuild -project "$PROJECT" -configuration Release -sdk iphoneos -arch arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          echo "::notice title=hxcpp cache (after build)::$(du -sh ~/.hxcpp_cache | cut -f1)"

      - name: Package IPA
        run: |
          APP=$(find export/release/ios/build -type d -name "*.app" -path "*iphoneos*" | head -n 1)
          if [ -z "$APP" ]; then echo "No .app found"; find export/release/ios -maxdepth 4; exit 1; fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qry ../PsychEngine.ipa Payload

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: iOSBuild
          path: PsychEngine.ipa
          if-no-files-found: error

  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Restore Haxelib Cache
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-windows-4.3.7-${{ hashFiles('setup/unix.sh') }}

      - name: Restore hxcpp Cache
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: hxcpp-windows-${{ github.sha }}
          restore-keys: hxcpp-windows-

      - name: Install Haxelib
        shell: bash
        run: |
          mkdir -p ~/.hxcpp_cache
          echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp_cache" >> "$GITHUB_ENV"

          haxelib setup ~/haxelib

          if [ "${{ steps.haxelib-cache.outputs.cache-hit }}" != "true" ]; then
            haxelib install hxcpp --quiet

            # El script debe poder ejecutarse desde Bash en Windows.
            chmod +x ./setup/unix.sh
            bash ./setup/unix.sh
          fi

      - name: Compile Windows
        shell: bash
        run: |
          set -o pipefail

          if ! haxelib run lime build windows -D officialBuild 2>&1 | tee compile-windows.log; then
            echo "::error title=lime build windows::$(tail -n 60 compile-windows.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Package Windows
        shell: pwsh
        run: |
          $BuildDir = "export/release/windows/bin"

          if (!(Test-Path $BuildDir)) {
            Write-Error "Windows build directory not found: $BuildDir"
            Get-ChildItem "export/release/windows" -Recurse -ErrorAction SilentlyContinue
            exit 1
          }

          $Exe = Get-ChildItem "export/release/windows" -Filter "*.exe" -Recurse |
            Select-Object -First 1

          if (!$Exe) {
            Write-Error "No Windows executable (.exe) was generated."
            Get-ChildItem "export/release/windows" -Recurse
            exit 1
          }

          Write-Host "Executable found: $($Exe.FullName)"

          Compress-Archive `
            -Path "$BuildDir/*" `
            -DestinationPath "ShadowCrystalEngine-Windows-x64.zip" `
            -Force

      - name: Publish Windows Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: WindowsBuild
          path: ShadowCrystalEngine-Windows-x64.zip
          if-no-files-found: error
